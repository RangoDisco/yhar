#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
bin = "./tmp/main"
cmd = "CGO_ENABLED=0 go build -gcflags=all=\"-N -l\" -o ./tmp/main ./cmd/."
delay = 1000
exclude_dir = ["assets", "tmp", "vendor", "testdata", "web"]
include_ext = ["go", "tpl", "tmpl", "html"]
poll = true
poll_interval = 500
stop_on_error = true

[log]
main_only = false
silent = false
time = false

[misc]
clean_on_exit = false

[proxy]
app_port = 0
app_start_timeout = 0
enabled = false
proxy_port = 0

[screen]
clear_on_rebuild = false
keep_scroll = true
