name: Releaser
on:
  push:
    tags:
      - '*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Build & create API package
        uses: docker/build-push-action@v6
        with:
          context: .
          target: gin-release
          push: true
          tags: |
            ghcr.io/rangodisco/yhar-api:${{github.ref_name}}
            ghcr.io/rangodisco/yhar-api:latest
      - name: Build & create Web package
        uses: docker/build-push-action@v6
        with:
          context: ./web
          target: web-prod
          push: true
          tags: |
            ghcr.io/rangodisco/yhar-web:${{github.ref_name}}
            ghcr.io/rangodisco/yhar-web:latest
